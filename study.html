<div id="output"></div>

<script>
function generateNotes() {
  document.getElementById("output").innerHTML =
  "Yaha Zoology ke notes generate honge.";

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoology Study Material</title>

<style>
body{
font-family: Arial;
background:#eef2ff;
padding:40px;
}

.container{
background:white;
padding:30px;
border-radius:10px;
max-width:800px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

textarea{
width:100%;
height:200px;
padding:10px;
font-size:15px;
}

button{
margin-top:15px;
padding:10px 20px;
background:#2ecc71;
border:none;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

#output{
margin-top:20px;
background:#f4f4f4;
padding:20px;
border-radius:6px;
}
</style>
</head>

<body>

<div class="container">

<h2>AI Study Material Generator</h2>

<p>Apna topic likhiye:</p>

<textarea id="topic" placeholder="Example: Animal Tissue"></textarea>

<br>

<button onclick="generate()">Generate</button>

<div id="output"></div>

</div>

<script>
function generate(){
let topic=document.getElementById("topic").value;

let text=`
Topic: ${topic}

Definition:
${topic} zoology ka ek important topic hai.

Short Notes:
• Iska study animals ki structure aur function ko samajhne mein help karta hai.
• Yeh BSc/B.A students ke liye important hai.

Example:
Earthworm, Frog, Human etc.
`;

document.getElementById("output").innerHTML=text;
}
</script>

</body>
</html>
